name: fleet-telemetry-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: telemetria
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [fleet-network]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [fleet-network]

  zookeeper:
    image: zookeeper:3.9
    environment:
      ZOO_CLIENT_PORT: 2181
      ZOO_TICK_TIME: 2000
    networks: [fleet-network]

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [fleet-network]

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    networks: [fleet-network]

  telemetry-service:
    build:
      context: ./services/telemetry-service
    environment:
      SERVER_PORT: 9050
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telemetria
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_FLYWAY_ENABLED: "true"
      TZ: America/Sao_Paulo
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_BROKER_URL: tcp://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-devSecretKey1234567890123456789012345678901234567890}
      SPRING_PROFILES_ACTIVE: docker
      SERVER_SSL_ENABLED: ${TELEMETRY_SSL_ENABLED:-false}
      SERVER_SSL_KEY_STORE: ${TELEMETRY_SSL_KEY_STORE:-}
      SERVER_SSL_KEY_STORE_PASSWORD: ${TELEMETRY_SSL_KEY_STORE_PASSWORD:-}
      SERVER_SSL_KEY_STORE_TYPE: ${TELEMETRY_SSL_KEY_STORE_TYPE:-PKCS12}
      SERVER_SSL_KEY_ALIAS: ${TELEMETRY_SSL_KEY_ALIAS:-}
      SECURITY_REQUIRE_HTTPS: ${TELEMETRY_REQUIRE_HTTPS:-false}
      INTEGRATION_SERVICE_URL: ${INTEGRATION_SERVICE_URL:-http://integration-engine:9060}
      INTEGRATION_SERVICE_SERPRO_API_KEY: ${INFOSIMPLES_SERPRO_INTERNAL_API_KEY:-}
    ports:
      - "${TELEMETRY_PORT:-9050}:9050"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [fleet-network]

  routing-service:
    build:
      context: ./services/routing-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleet_routing
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "${ROUTING_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fleet-network]

  integration-engine:
    build:
      context: ./services/integration-engine
    environment:
      SERVER_PORT: 9060
      SPRING_PROFILES_ACTIVE: ${INTEGRATION_PROFILES:-docker}
      SEFAZ_CTE_AMBIENTE: ${SEFAZ_CTE_AMBIENTE:-homologacao}
      SEFAZ_CTE_AUTORIZACAO_URL: ${SEFAZ_CTE_AUTORIZACAO_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeRecepcaoSincV4}
      SEFAZ_CTE_CONSULTA_URL: ${SEFAZ_CTE_CONSULTA_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeConsultaV4}
      SEFAZ_CTE_EVENTO_URL: ${SEFAZ_CTE_EVENTO_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeRecepcaoEventoV4}
      SEFAZ_CTE_STATUS_URL: ${SEFAZ_CTE_STATUS_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeStatusServicoV4}
      SEFAZ_CERT_PATH: ${SEFAZ_CERT_PATH:-}
      SEFAZ_CERT_PASSWORD: ${SEFAZ_CERT_PASSWORD:-}
      SEFAZ_CERT_KEY_PASSWORD: ${SEFAZ_CERT_KEY_PASSWORD:-}
      SEFAZ_CERT_TYPE: ${SEFAZ_CERT_TYPE:-PKCS12}
      SEFAZ_TRUSTSTORE_PATH: ${SEFAZ_TRUSTSTORE_PATH:-}
      SEFAZ_TRUSTSTORE_PASSWORD: ${SEFAZ_TRUSTSTORE_PASSWORD:-}
      SEFAZ_TRUSTSTORE_TYPE: ${SEFAZ_TRUSTSTORE_TYPE:-PKCS12}
      SEFAZ_TLS_PROTOCOL: ${SEFAZ_TLS_PROTOCOL:-TLSv1.2}
      SEFAZ_CTE_AUTHORIZATION_ENABLED: ${SEFAZ_CTE_AUTHORIZATION_ENABLED:-false}
      SEFAZ_CTE_CANCELLATION_ENABLED: ${SEFAZ_CTE_CANCELLATION_ENABLED:-false}
      SEFAZ_CTE_AUTHORIZED_FISCAL_TEST_DATA: ${SEFAZ_CTE_AUTHORIZED_FISCAL_TEST_DATA:-false}
      INFOSIMPLES_SERPRO_RADAR_URL: ${INFOSIMPLES_SERPRO_RADAR_URL:-}
      INFOSIMPLES_TOKEN: ${INFOSIMPLES_TOKEN:-}
      INFOSIMPLES_SERPRO_INTERNAL_API_KEY: ${INFOSIMPLES_SERPRO_INTERNAL_API_KEY:-}
      INFOSIMPLES_SERPRO_CONNECT_TIMEOUT: ${INFOSIMPLES_SERPRO_CONNECT_TIMEOUT:-3s}
      INFOSIMPLES_SERPRO_READ_TIMEOUT: ${INFOSIMPLES_SERPRO_READ_TIMEOUT:-10s}
      INFOSIMPLES_SERPRO_MAX_ATTEMPTS: ${INFOSIMPLES_SERPRO_MAX_ATTEMPTS:-3}
      INFOSIMPLES_SERPRO_RETRY_DELAY: ${INFOSIMPLES_SERPRO_RETRY_DELAY:-200ms}
      INFOSIMPLES_SERPRO_CIRCUIT_FAILURE_THRESHOLD: ${INFOSIMPLES_SERPRO_CIRCUIT_FAILURE_THRESHOLD:-5}
      INFOSIMPLES_SERPRO_CIRCUIT_OPEN_DURATION: ${INFOSIMPLES_SERPRO_CIRCUIT_OPEN_DURATION:-30s}
      INFOSIMPLES_SERPRO_REQUESTS_PER_MINUTE: ${INFOSIMPLES_SERPRO_REQUESTS_PER_MINUTE:-60}
      INFOSIMPLES_SERPRO_CACHE_TTL: ${INFOSIMPLES_SERPRO_CACHE_TTL:-5m}
      INFOSIMPLES_SERPRO_CACHE_MAX_ENTRIES: ${INFOSIMPLES_SERPRO_CACHE_MAX_ENTRIES:-1000}
      INFOSIMPLES_SERPRO_UNKNOWN_STATUS_BLOCKS: ${INFOSIMPLES_SERPRO_UNKNOWN_STATUS_BLOCKS:-true}
      INFOSIMPLES_SERPRO_BLOCKING_STATUSES: ${INFOSIMPLES_SERPRO_BLOCKING_STATUSES:-AUTUADO,PENDENTE}
      SERVER_SSL_ENABLED: ${INTEGRATION_SSL_ENABLED:-false}
      SERVER_SSL_KEY_STORE: ${INTEGRATION_SSL_KEY_STORE:-}
      SERVER_SSL_KEY_STORE_PASSWORD: ${INTEGRATION_SSL_KEY_STORE_PASSWORD:-}
      SERVER_SSL_KEY_STORE_TYPE: ${INTEGRATION_SSL_KEY_STORE_TYPE:-PKCS12}
      SERVER_SSL_KEY_ALIAS: ${INTEGRATION_SSL_KEY_ALIAS:-}
      SECURITY_REQUIRE_HTTPS: ${INTEGRATION_REQUIRE_HTTPS:-false}
    ports:
      - "${INTEGRATION_PORT:-9060}:9060"
    networks: [fleet-network]

networks:
  fleet-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
