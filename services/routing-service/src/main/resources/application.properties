spring.application.name=routing-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/fleet_routing
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
osrm.api.url=https://router.project-osrm.org/nearest/v1/driving/%f,%f
snap.cache.ttl.hours=24
snap.coordinate.rounding=3
logging.level.root=INFO
logging.level.com.fleet.routing=DEBUG
