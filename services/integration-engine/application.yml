camel:
  springboot:
    name: TelemetriaSefazIntegration
    main-run-controller: true

sefaz:
  estado: MT
  ambiente: 2 # 1=Produção, 2=Homologação
  timeout: 30000

  certificado:
    path: /opt/certificados/empresa_a1.pfx
    senha: ${SENHA_CERTIFICADO:}

  # CT-e v4.00 (Mato Grosso utiliza a estrutura SVRS)
  cte:
    url-autorizacao: https://cte-homologacao.svrs.rs.gov.br/ws/cteRecepcaoSincV4/cteRecepcaoSincV4.asmx
    url-consulta: https://cte-homologacao.svrs.rs.gov.br/ws/cteConsultaV4/cteConsultaV4.asmx
    url-evento: https://cte-homologacao.svrs.rs.gov.br/ws/cteRecepcaoEventoV4/cteRecepcaoEventoV4.asmx
    url-status-servico: https://cte-homologacao.svrs.rs.gov.br/ws/cteStatusServicoV4/cteStatusServicoV4.asmx

  # NF-e v4.00 (SEFAZ MT Homologação)
  nfe:
    url-autorizacao: https://homologacao.sefaz.mt.gov.br/nfews/v2/services/NfeAutorizacao4
    url-ret-autorizacao: https://homologacao.sefaz.mt.gov.br/nfews/v2/services/NfeRetAutorizacao4
    url-consulta: https://homologacao.sefaz.mt.gov.br/nfews/v2/services/NfeConsulta4
    url-evento: https://homologacao.sefaz.mt.gov.br/nfews/v2/services/RecepcaoEvento4
    url-inutilizacao: https://homologacao.sefaz.mt.gov.br/nfews/v2/services/NfeInutilizacao4
    url-status-servico: https://homologacao.sefaz.mt.gov.br/nfews/v2/services/NfeStatusServico4

antt:
  ciot:
    url-base: https://api-homologacao.pef.com.br/v1/ciot
    token: ${PEF_TOKEN:Bearer_JWT_TOKEN_AQUI}
  piso-minimo:
    url-base: https://calculadorafrete.antt.gov.br/api/v1/calcular
    token: ${ANTT_TOKEN:Bearer_TOKEN_AQUI}

infosimples:
  url-base: https://api.infosimples.com/v2/consultas/receita-federal/cte
  token: ${INFOSIMPLES_TOKEN:token_api_aqui}
