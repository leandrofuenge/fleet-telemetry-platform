# Perfil fail-fast: não inicia homologação sem endpoint e segredos explicitamente fornecidos.
infosimples:
  url-serpro-radar: ${INFOSIMPLES_SERPRO_RADAR_URL}
  token: ${INFOSIMPLES_TOKEN}
  serpro:
    api-key: ${INFOSIMPLES_SERPRO_INTERNAL_API_KEY}

management:
  endpoint:
    health:
      show-details: when_authorized
