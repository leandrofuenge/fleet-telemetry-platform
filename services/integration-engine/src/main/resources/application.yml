server:
  port: ${SERVER_PORT:9060}

spring:
  application:
    name: integration-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telemetria}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

camel:
  springboot:
    name: IntegrationEngineCamelContext
    main-run-controller: true

integration:
  data-transfer:
    max-document-bytes: ${INTEGRATION_DATA_TRANSFER_MAX_DOCUMENT_BYTES:1048576}
