name: fleet-telemetry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: telemetria
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [fleet-network]

  redis:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [fleet-network]

  zookeeper:
    image: zookeeper:3.9
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks: [fleet-network]

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [fleet-network]

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [fleet-network]

  telemetry-service:
    build:
      context: ../../services/telemetry-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 9050
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telemetria
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID: telemetry-service
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in deploy/compose/.env}
    ports:
      - "9050:9050"
    volumes:
      - ../../var/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    networks: [fleet-network]

  routing-service:
    build:
      context: ../../services/routing-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleet_routing
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [fleet-network]

  integration-engine:
    build:
      context: ../../services/integration-engine
    environment:
      SERVER_PORT: 9060
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: ${INTEGRATION_PROFILES:-docker}
      SEFAZ_CTE_AMBIENTE: ${SEFAZ_CTE_AMBIENTE:-homologacao}
      SEFAZ_CTE_AUTORIZACAO_URL: ${SEFAZ_CTE_AUTORIZACAO_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeRecepcaoSincV4}
      SEFAZ_CTE_CONSULTA_URL: ${SEFAZ_CTE_CONSULTA_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeConsultaV4}
      SEFAZ_CTE_EVENTO_URL: ${SEFAZ_CTE_EVENTO_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeRecepcaoEventoV4}
      SEFAZ_CTE_STATUS_URL: ${SEFAZ_CTE_STATUS_URL:-https://homologacao.sefaz.mt.gov.br/ctews2/services/CTeStatusServicoV4}
      SEFAZ_CERT_PATH: ${SEFAZ_CERT_PATH:-}
      SEFAZ_CERT_PASSWORD: ${SEFAZ_CERT_PASSWORD:-}
      SEFAZ_CERT_KEY_PASSWORD: ${SEFAZ_CERT_KEY_PASSWORD:-}
      SEFAZ_CERT_TYPE: ${SEFAZ_CERT_TYPE:-PKCS12}
      SEFAZ_TRUSTSTORE_PATH: ${SEFAZ_TRUSTSTORE_PATH:-}
      SEFAZ_TRUSTSTORE_PASSWORD: ${SEFAZ_TRUSTSTORE_PASSWORD:-}
      SEFAZ_TRUSTSTORE_TYPE: ${SEFAZ_TRUSTSTORE_TYPE:-PKCS12}
      SEFAZ_TLS_PROTOCOL: ${SEFAZ_TLS_PROTOCOL:-TLSv1.2}
      SEFAZ_CTE_AUTHORIZATION_ENABLED: ${SEFAZ_CTE_AUTHORIZATION_ENABLED:-false}
      SEFAZ_CTE_CANCELLATION_ENABLED: ${SEFAZ_CTE_CANCELLATION_ENABLED:-false}
      SEFAZ_CTE_AUTHORIZED_FISCAL_TEST_DATA: ${SEFAZ_CTE_AUTHORIZED_FISCAL_TEST_DATA:-false}
      INFOSIMPLES_SERPRO_RADAR_URL: ${INFOSIMPLES_SERPRO_RADAR_URL:-}
      INFOSIMPLES_TOKEN: ${INFOSIMPLES_TOKEN:-}
      INFOSIMPLES_SERPRO_INTERNAL_API_KEY: ${INFOSIMPLES_SERPRO_INTERNAL_API_KEY:-}
      INFOSIMPLES_SERPRO_CONNECT_TIMEOUT: ${INFOSIMPLES_SERPRO_CONNECT_TIMEOUT:-3s}
      INFOSIMPLES_SERPRO_READ_TIMEOUT: ${INFOSIMPLES_SERPRO_READ_TIMEOUT:-10s}
      INFOSIMPLES_SERPRO_MAX_ATTEMPTS: ${INFOSIMPLES_SERPRO_MAX_ATTEMPTS:-3}
      INFOSIMPLES_SERPRO_RETRY_DELAY: ${INFOSIMPLES_SERPRO_RETRY_DELAY:-200ms}
      INFOSIMPLES_SERPRO_CIRCUIT_FAILURE_THRESHOLD: ${INFOSIMPLES_SERPRO_CIRCUIT_FAILURE_THRESHOLD:-5}
      INFOSIMPLES_SERPRO_CIRCUIT_OPEN_DURATION: ${INFOSIMPLES_SERPRO_CIRCUIT_OPEN_DURATION:-30s}
      INFOSIMPLES_SERPRO_REQUESTS_PER_MINUTE: ${INFOSIMPLES_SERPRO_REQUESTS_PER_MINUTE:-60}
      INFOSIMPLES_SERPRO_CACHE_TTL: ${INFOSIMPLES_SERPRO_CACHE_TTL:-5m}
      INFOSIMPLES_SERPRO_CACHE_MAX_ENTRIES: ${INFOSIMPLES_SERPRO_CACHE_MAX_ENTRIES:-1000}
      INFOSIMPLES_SERPRO_UNKNOWN_STATUS_BLOCKS: ${INFOSIMPLES_SERPRO_UNKNOWN_STATUS_BLOCKS:-true}
      INFOSIMPLES_SERPRO_BLOCKING_STATUSES: ${INFOSIMPLES_SERPRO_BLOCKING_STATUSES:-AUTUADO,PENDENTE}
    ports:
      - "9060:9060"
    volumes:
      - ../../var/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9060/actuator/health/liveness > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks: [fleet-network]

networks:
  fleet-network:
    name: fleet-network

volumes:
  postgres-data:
